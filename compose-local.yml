version: '3.8'

services:
  config-server:
    build:
      context: ./spring-petclinic-config-server
      dockerfile: Dockerfile
    image: petclinic-config-server:dev
    container_name: config-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-I", "http://localhost:8888"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - 8888:8888

  discovery-server:
    build:
      context: ./spring-petclinic-discovery-server
      dockerfile: Dockerfile
    image: petclinic-discovery-server:dev
    container_name: discovery-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - 8761:8761

  customers-service:
    build:
      context: ./spring-petclinic-customers-service
      dockerfile: Dockerfile
    image: petclinic-customers-service:dev
    container_name: customers-service
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - 8081:8081

  visits-service:
    build:
      context: ./spring-petclinic-visits-service
      dockerfile: Dockerfile
    image: petclinic-visits-service:dev
    container_name: visits-service
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - 8082:8082

  vets-service:
    build:
      context: ./spring-petclinic-vets-service
      dockerfile: Dockerfile
    image: petclinic-vets-service:dev
    container_name: vets-service
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - 8083:8083

  api-gateway:
    build:
      context: ./spring-petclinic-api-gateway
      dockerfile: Dockerfile
    image: petclinic-api-gateway:dev
    container_name: api-gateway
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - 8080:8080

  tracing-server:
    image: openzipkin/zipkin
    container_name: tracing-server
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - JAVA_OPTS=-XX:+UnlockExperimentalVMOptions -Djava.security.egd=file:/dev/./urandom
    ports:
      - 9411:9411

  admin-server:
    build:
      context: ./spring-petclinic-admin-server
      dockerfile: Dockerfile
    image: petclinic-admin-server:dev
    container_name: admin-server
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - 9090:9090

  hystrix-dashboard:
    build:
      context: ./spring-petclinic-hystrix-dashboard
      dockerfile: Dockerfile
    image: petclinic-hystrix-dashboard:dev
    container_name: hystrix-dashboard
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - 7979:7979

  grafana-server:
    build:
      context: ./spring-petclinic-grafana-server
      dockerfile: Dockerfile
    image: petclinic-grafana-server:dev
    container_name: grafana-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - 3000:3000

  prometheus-server:
    build:
      context: ./spring-petclinic-prometheus-server
      dockerfile: Dockerfile
    image: petclinic-prometheus-server:dev
    container_name: prometheus-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - 9091:9090

  mysql-server:
    image: mysql:5.7.8
    container_name: mysql-server
    environment: 
      MYSQL_ROOT_PASSWORD: petclinic
      MYSQL_DATABASE: petclinic
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - 3306:3306
